name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke suite (module mode)
        run: python tests/smoke_test.py --module

      - name: Install tenx
        run: pip install .

      - name: Smoke suite (installed mode)
        run: python tests/smoke_test.py

      - name: Harness self-check
        run: tenx validate
