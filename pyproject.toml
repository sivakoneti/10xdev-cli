[project]
name = "tenx"
version = "0.16.0"
description = "Meta-harness CLI: context-as-code for AI coding agents. Structured markdown artifacts, SDLC linting, session-start context packets. Works on any project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sivakoneti" }]
keywords = ["ai", "agents", "context-engineering", "cli", "sdlc"]
dependencies = []

[project.scripts]
tenx = "tenx.cli:main"
"10x" = "tenx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenx"]
