# tenx harness configuration
project: tenx
description: "Meta-harness CLI: context-as-code for AI coding agents (the 10X meta-harness pattern, portable to any project)"
# Optional: link the code repo this harness governs (default: parent of .tenx)
# code_root: ..
# Rule overrides for `tenx validate` (see rules.yaml defaults)
rules:
  stale_days: 14
  quiet_days: 7
# Commit-time write-back gate (SPC-024-T2): this repo eats its own dogfood,
# so staged code with no activity-log write-back BLOCKS the commit.
# New projects default to warn; strict mode is opt-in per repo.
commit_gate: on
